<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="base" x1="100" y1="0" x2="100" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0083FF"/>
      <stop offset="1" stop-color="#004FFE"/>
    </linearGradient>
    <radialGradient id="pink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(25.5 100) rotate(-0.77873) scale(257.524)">
      <stop stop-color="#FD56E0"/>
      <stop offset="1" stop-color="#0000FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(-6.21378e-06 200) rotate(-43.7562) scale(276.898)">
      <stop stop-color="#FFBF00"/>
      <stop offset="1" stop-color="#FF00E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="100" y1="0" x2="100" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1"/>
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="glass"><circle cx="200" cy="200" r="167"/></clipPath>
    <!-- The glass's shadow falls only outside it, as a CSS box-shadow does. -->
    <mask id="outside" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <rect width="400" height="400" fill="#fff"/>
      <circle cx="200" cy="200" r="167" fill="#000"/>
    </mask>
    <clipPath id="tile"><rect width="400" height="400" rx="90.29"/></clipPath>
  </defs>
  <g transform="translate(100 100) scale(2.06)">
    <g clip-path="url(#tile)">
      <g transform="scale(2)">
        <rect width="200" height="200" fill="url(#base)"/>
        <rect width="200" height="200" fill="url(#pink)"/>
        <rect width="200" height="200" fill="url(#gold)"/>
        <rect width="200" height="200" fill="url(#shade)" fill-opacity="0.2"/>
      </g>
      <g mask="url(#outside)">
        <circle cx="200" cy="207" r="167" fill="#9100ab" fill-opacity="0.34" filter="url(#soften)"/>
      </g>
      <circle cx="200" cy="200" r="167" fill="#fff" fill-opacity="0.6"/>
      <circle cx="200" cy="200" r="166.4" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="1.2"/>
      <g fill="#721d23">
        <path d="M176.43 127.39 V98.02 A12 12 0 0 1 188.43 86.02 H211.57 A12 12 0 0 1 223.57 98.02 V127.39 Z" fill-opacity="0.5"/>
        <rect x="158.96" y="140.45" width="82.02" height="127.24" rx="12.25"/>
        <rect x="191.17" y="262" width="17.67" height="150" clip-path="url(#glass)"/>
      </g>
    </g>
  </g>
</svg>
